{% load static %}
<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Delete Post</title>
    <link rel="stylesheet" href="{% static 'css/output.css' %}" />
  </head>
  <body class="bg-gray-100 p-8 font-sans text-gray-800">
    {% include 'blog/navbar.html' %}
    <main class="mx-auto max-w-2xl px-4 py-12 sm:px-6">
      <section class="rounded-xl border border-gray-200 bg-white p-6 shadow-sm">
        <h1 class="text-2xl font-black tracking-tight text-gray-900">
          Delete Post
        </h1>
        <p class="mt-3 text-gray-600">
          Are you sure you want to delete "{{ post.title }}"?
        </p>

        <form method="post" class="mt-6 flex flex-wrap items-center gap-3">
          {% csrf_token %}
          <button
            type="submit"
            class="rounded-lg bg-red-600 px-5 py-2 text-sm font-semibold text-white shadow-sm hover:bg-red-700"
          >
            Delete
          </button>
          <a
            href="{% url 'show' post.id %}"
            class="rounded-lg border border-gray-300 bg-white px-5 py-2 text-sm font-semibold text-gray-700 hover:bg-gray-50"
          >
            Cancel
          </a>
        </form>
      </section>
    </main>
    {% include 'blog/footer.html' %}
  </body>
</html>
